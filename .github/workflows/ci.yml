name: oracle

on:
  push:
  pull_request:

jobs:
  oracle-test:
    name: oracle (reference only) — test and Kotoba conformance (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    steps:
      - name: oracle notice
        run: echo "ORACLE job - reference measurement only, not a gate, not a required check, no native build or gate depends on it (AGENTS.md CI exception, JUN-579)."
      - uses: actions/checkout@v4
      - name: check no deleted-repo pins remain
        run: |
          python3 - <<'EOF'
          import re, sys
          txt = open('deps.edn').read()
          bad = []
          for i, ln in enumerate(txt.split('\n'), 1):
              for m in re.finditer(r':git/url\s+"(https://github\.com/kotoba-lang/([a-zA-Z0-9_.\-]+?)(\.git)?)"', ln):
                  if m.group(2) not in ('kotoba', 'amu'):
                      bad.append('%d: dead repo URL %s' % (i, m.group(1)))
          for m in re.finditer(r"((?:io\.github\.kotoba-lang|kotoba-lang|gftd)/[a-zA-Z0-9_.\-]+)\s*\n?\s*(\{[^{}]*\})", txt):
              key, block = m.group(1), m.group(2)
              if key in ("io.github.kotoba-lang/amu", "kotoba-lang/amu"):
                  continue
              if ":git/url" not in block and re.search(r":git/sha\s+\"[0-9a-f]+\"|:sha\s+\"[0-9a-f]+\"", block):
                  bad.append('%d: bare git sha without :git/url: %s' % (txt[:m.start()].count("\n") + 1, key))
          if bad:
              print("deleted-repo pins remain:")
              [print("  " + b) for b in bad]
              sys.exit(1)
          print("pins OK: no deleted kotoba-lang repo URLs or bare shas")
          EOF
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: latest
      - name: probe reference deps (skip oracle when unavailable)
        id: deps-probe
        continue-on-error: true
        run: clojure -P -Mtest:lint:kotoba
      - name: probe Kotoba compiler path (skip amu path when unusable)
        id: kotoba-probe
        continue-on-error: true
        run: |
          found=""
          for d in $(clojure -Spath -M:kotoba | tr ':' '\n'); do
            if [ -e "$d/kotoba/security/abac.cljc" ] || [ -e "$d/kotoba/security/abac.clj" ]; then found="$d"; break; fi
          done
          if [ -z "$found" ]; then echo "kotoba.security/abac is not JVM-loadable on the :kotoba classpath (amu needs abac.clj[c], monorepo has only abac.cljk)"; exit 1; fi
          echo "kotoba compiler path usable: $found"
      - run: clojure -M:test
        if: steps.deps-probe.outcome == 'success'
      - run: clojure -M:lint
        if: steps.deps-probe.outcome == 'success'
      - name: Compile Kotoba construction safety
        if: steps.deps-probe.outcome == 'success' && steps.kotoba-probe.outcome == 'success'
        run: |
          mkdir -p target/kotoba
          clojure -M:kotoba compile test/kami_app_giemon_factory/construction_safety_conformance.kotoba \
            --source-path src --target js-browser --output target/kotoba/construction.mjs
          clojure -M:kotoba compile test/kami_app_giemon_factory/construction_safety_conformance.kotoba \
            --source-path src --target wasm32-browser --output target/kotoba/construction.wasm
      - name: Execute construction safety Web and Wasm cases
        if: steps.deps-probe.outcome == 'success' && steps.kotoba-probe.outcome == 'success'
        run: |
          compiler_src="$(clojure -Spath -M:kotoba | tr ':' '\n' | grep '/compiler/' | head -1)"
          node scripts/verify-kotoba-construction-safety.mjs target/kotoba/construction.mjs \
            target/kotoba/construction.wasm "$(dirname "$compiler_src")/runtime/browser-host.mjs"
      - name: oracle skipped - reference deps unavailable (notice, not a failure)
        if: steps.deps-probe.outcome != 'success'
        run: echo 'NOTICE - reference deps could not be fetched (removed or private); skipping oracle job. Not a failure; public CI uses no private credentials.'
      - name: oracle skipped - amu compiler path unavailable (notice, not a failure)
        if: steps.deps-probe.outcome == 'success' && steps.kotoba-probe.outcome != 'success'
        run: |
          echo 'NOTICE - skipping the amu compiler path (Compile Kotoba construction safety, Execute Web and Wasm cases). amu@78f43e6 requires the kotoba.security namespaces abac/crypto-policy/hardware/information-flow as JVM-loadable sources, but the deleted kotoba-lang/security.git provided them and the monorepo lib/kotoba.security at ee75001 has only .cljk (not loadable by JVM Clojure). Dev decision, Itonami Bots item 134; tracking: AWAI-3835. The -M:test and -M:lint steps above still ran.'
          echo "::notice ::oracle skipped amu compiler path (amu@78f43e6 needs JVM-loadable kotoba.security namespaces; monorepo has only .cljk). See AWAI-3835."
