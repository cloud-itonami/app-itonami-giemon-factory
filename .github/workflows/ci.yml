name: oracle

on:
  push:
  pull_request:

jobs:
  oracle-test:
    name: oracle (reference only) — test and Kotoba conformance (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    steps:
      - name: oracle notice
        run: echo "ORACLE job - reference measurement only, not a gate, not a required check, no native build or gate depends on it (AGENTS.md CI exception, JUN-579)."
      - uses: actions/checkout@v4
      - name: check no deleted-repo pins remain
        run: |
          python3 - <<'EOF'
          import re, sys
          txt = open('deps.edn').read()
          bad = []
          for i, ln in enumerate(txt.split('\n'), 1):
              for m in re.finditer(r':git/url\s+"(https://github\.com/kotoba-lang/([a-zA-Z0-9_.\-]+?)(\.git)?)"', ln):
                  if m.group(2) not in ('kotoba',):
                      bad.append('%d: dead repo URL %s' % (i, m.group(1)))
          for m in re.finditer(r"((?:io\.github\.kotoba-lang|kotoba-lang|gftd)/[a-zA-Z0-9_.\-]+)\s*\n?\s*(\{[^{}]*\})", txt):
              key, block = m.group(1), m.group(2)
              if ":git/url" not in block and re.search(r":git/sha\s+\"[0-9a-f]+\"|:sha\s+\"[0-9a-f]+\"", block):
                  bad.append('%d: bare git sha without :git/url: %s' % (txt[:m.start()].count("\n") + 1, key))
          if bad:
              print("deleted-repo pins remain:")
              [print("  " + b) for b in bad]
              sys.exit(1)
          print("pins OK: no deleted kotoba-lang repo URLs or bare shas")
          EOF
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: latest
      - name: probe reference deps (skip oracle when unavailable)
        id: deps-probe
        continue-on-error: true
        run: clojure -P -M:test:lint
      - run: clojure -M:test
        if: steps.deps-probe.outcome == 'success'
      - run: clojure -M:lint
        if: steps.deps-probe.outcome == 'success'
      - name: oracle skipped - reference deps unavailable (notice, not a failure)
        if: steps.deps-probe.outcome != 'success'
        run: echo 'NOTICE - reference deps could not be fetched (removed or private); skipping oracle job. Not a failure; public CI uses no private credentials.'
